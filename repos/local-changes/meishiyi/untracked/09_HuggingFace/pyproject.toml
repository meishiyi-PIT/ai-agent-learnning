[project]
name = "hf-practice"
version = "0.1.0"
description = "模块五 · 6.HuggingFace 实战指南 配套练习（Pipeline / Tokenizer / Model / Datasets / Evaluate）"
requires-python = ">=3.11,<3.12"

# 版本号完全按课件 1.4 节的 pip 命令钉死，保证课件里的代码和 API 行为一致。
# torch 只要求 >=2.4（课件要求）；这台机器是 Intel 集显、没有 NVIDIA 卡，
# Windows 上 PyPI 的 torch 轮子本身就是 CPU 版，不需要额外指定 CUDA 索引。
dependencies = [
    "torch>=2.4",
    "transformers==4.51.3",
    "datasets==3.2.0",
    "evaluate==0.4.3",
    "peft==0.15.2",
    "accelerate==1.15.0",
    "gradio==4.43.0",
    "pandas>=2.0",        # 课件 5.1 Dataset.from_pandas
    "scikit-learn>=1.3",  # evaluate 的 accuracy/f1/precision/recall 指标底层调 sklearn
]

[tool.uv]
# 这是练习目录，不是要打包安装的库：告诉 uv 只装依赖、不要 build 本项目
package = false

# 课件 1.4 用的清华 PyPI 镜像，国内下 torch（几百 MB）快很多
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
