<svg xmlns="http://www.w3.org/2000/svg" width="644" height="1080" viewBox="166 0 644 1080" role="img" aria-labelledby="title" data-source="articles/lesson-04/context-http.md" data-diagram-index="1">
  <title id="title">上下文筛选与工具消息完整性</title>
  <defs><marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs>
  <style>.node{fill:#f7faff;stroke:#a7bde4}.heading{font:600 16px "Microsoft YaHei",sans-serif;fill:#14213d}.divider{stroke:#dce5f2}.file{font:13px Consolas,monospace;fill:#526077}.function{font:14px Consolas,monospace;fill:#2458a6}.connector{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.label{font:13px "Microsoft YaHei",sans-serif;fill:#526077}</style>
