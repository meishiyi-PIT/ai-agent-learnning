  <g data-node="C" transform="translate(190 280)"><rect class="node" width="260" height="90" rx="8"/><text class="heading" x="20" y="29">保留当前请求及随后全部消息</text><path class="divider" d="M20 43 H240"/><g data-stage="06-context-model-performance" data-path="src/zhifu/modules/agent_runtime/context.py" data-symbol="select_context"><text class="file" x="20" y="70">context.py</text><text class="function" x="115.484" y="70">select_context()</text></g></g>
