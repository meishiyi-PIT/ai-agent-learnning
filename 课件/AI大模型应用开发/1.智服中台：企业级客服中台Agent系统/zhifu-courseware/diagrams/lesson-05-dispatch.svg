<svg xmlns="http://www.w3.org/2000/svg" width="456" height="1240" viewBox="134 0 456 1240" role="img" aria-labelledby="title" data-source="articles/lesson-05/operations-recovery.md" data-diagram-index="2">
  <title id="title">任务领取与模型额度</title><defs><marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs><style>.node{fill:#f7faff;stroke:#a7bde4}.heading{font:600 16px "Microsoft YaHei",sans-serif;fill:#14213d}.divider{stroke:#dce5f2}.file{font:13px Consolas,monospace;fill:#526077}.function{font:14px Consolas,monospace;fill:#2458a6}.connector{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.label{font:13px "Microsoft YaHei",sans-serif;fill:#526077}</style>
  <path class="connector" data-from="A" data-to="B" d="M320 110 V150"/><path class="connector" data-from="B" data-to="C" d="M320 220 V270"/><path class="connector" data-from="C" data-to="D" d="M320 360 V410"/><path class="connector" data-from="D" data-to="E" d="M320 500 V550"/><path class="connector" data-from="E" data-to="F" data-label="可用" d="M320 640 V700"/><text class="label" x="332" y="675">可用</text><path class="connector" data-from="E" data-to="B" data-label="暂满" d="M430 595 H534 V185 H416"/><text class="label" x="544" y="402">暂满</text><path class="connector" data-from="F" data-to="G" d="M320 790 V830"/><path class="connector" data-from="G" data-to="H" d="M320 920 V970"/><path class="connector" data-from="H" data-to="I" d="M320 1060 V1110"/>
  <g data-node="A" transform="translate(180 20)"><rect class="node" width="280" height="90" rx="8"/><text class="heading" x="20" y="29">HTTP 受理并保存 AgentRun</text><path class="divider" d="M20 43 H260"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/api.py" data-symbol="enqueue"><text class="file" x="20" y="70">agent_runtime/api.py</text><text class="function" x="186.953" y="70">enqueue()</text></g></g>
  <g data-node="B" transform="translate(224 150)"><rect class="node" width="192" height="70" rx="8"/><text class="heading" x="20" y="41">QUEUED：等待领取</text></g>
  <g data-node="C" transform="translate(178 270)"><rect class="node" width="284" height="90" rx="8"/><text class="heading" x="20" y="29">检查租户活跃数和调度顺序</text><path class="divider" d="M20 43 H264"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/worker.py" data-symbol="claim"><text class="file" x="20" y="70">agent_runtime/worker.py</text><text class="function" x="208.406" y="70">claim()</text></g></g>
  <g data-node="D" transform="translate(178 410)"><rect class="node" width="284" height="90" rx="8"/><text class="heading" x="20" y="29">取得租户锁并重新核对</text><path class="divider" d="M20 43 H264"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/worker.py" data-symbol="claim"><text class="file" x="20" y="70">agent_runtime/worker.py</text><text class="function" x="208.406" y="70">claim()</text></g></g>
  <g data-node="E" transform="translate(210 550)"><rect class="node" width="220" height="90" rx="8"/><text class="heading" x="20" y="29">Redis 共享额度是否可用</text><path class="divider" d="M20 43 H200"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/capacity.py" data-symbol="acquire"><text class="file" x="20" y="70">capacity.py</text><text class="function" x="122.625" y="70">acquire()</text></g></g>
  <g data-node="F" transform="translate(164 700)"><rect class="node" width="312" height="90" rx="8"/><text class="heading" x="20" y="29">增加 lease_token 并进入 RUNNING</text><path class="divider" d="M20 43 H292"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/worker.py" data-symbol="claim"><text class="file" x="20" y="70">agent_runtime/worker.py</text><text class="function" x="208.406" y="70">claim()</text></g></g>
  <g data-node="G" transform="translate(154 830)"><rect class="node" width="332" height="90" rx="8"/><text class="heading" x="20" y="29">执行工具或模型任务</text><path class="divider" d="M20 43 H312"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/worker.py" data-symbol="execute_one"><text class="file" x="20" y="70">agent_runtime/worker.py</text><text class="function" x="208.406" y="70">execute_one()</text></g></g>
