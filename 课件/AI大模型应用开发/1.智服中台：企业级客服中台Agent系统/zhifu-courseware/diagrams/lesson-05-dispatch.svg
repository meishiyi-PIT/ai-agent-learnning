  <g data-node="I" transform="translate(214 1110)"><rect class="node" width="212" height="90" rx="8"/><text class="heading" x="20" y="29">释放本次 Redis 额度</text><path class="divider" d="M20 43 H192"/><g data-stage="09-course-delivery" data-path="src/zhifu/modules/agent_runtime/capacity.py" data-symbol="release"><text class="file" x="20" y="70">capacity.py</text><text class="function" x="122.625" y="70">release()</text></g></g>
