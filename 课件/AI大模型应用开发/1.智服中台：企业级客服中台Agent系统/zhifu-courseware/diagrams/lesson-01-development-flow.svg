<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1360" viewBox="0 0 640 1360" role="img" aria-labelledby="flow-title flow-description">
  <title id="flow-title">开发阶段与源码入口</title>
  <desc id="flow-description">00至09阶段自上而下排列。每个节点上方为业务说明，下方每行左侧为文件位置、右侧为对应函数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .node { fill: #f7faff; stroke: #a7bde4; stroke-width: 1; }
    .number { font: 700 16px Arial, sans-serif; fill: #2f6bce; }
    .heading { font: 600 16px "Microsoft YaHei", sans-serif; fill: #14213d; }
    .divider { stroke: #dce5f2; stroke-width: 1; }
    .file { font: 13px Consolas, monospace; fill: #526077; }
    .function { font: 14px Consolas, monospace; fill: #2458a6; }
    .connector { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <!-- 每条连线表示相邻教学阶段的推进，文件与函数按同一行对应。 -->
  <g aria-label="阶段顺序">
    <path class="connector" d="M320 124 V144"/>
    <path class="connector" d="M320 260 V280"/>
    <path class="connector" d="M320 396 V416"/>
    <path class="connector" d="M320 532 V552"/>
    <path class="connector" d="M320 668 V688"/>
    <path class="connector" d="M320 804 V824"/>
    <path class="connector" d="M320 940 V960"/>
    <path class="connector" d="M320 1076 V1096"/>
    <path class="connector" d="M320 1212 V1232"/>
  </g>
  <g data-stage="00" transform="translate(184 16)">
    <rect class="node" width="272" height="104" rx="8"/>
    <text class="number" x="20" y="29">00</text>
    <text class="heading" x="58" y="29">运行登录、订单与售后接口</text>
    <path class="divider" d="M20 43 H252"/>
    <text class="file" x="20" y="76">app.py</text>
    <text class="function" x="86.89" y="76">create_app()</text>
  </g>
  <g data-stage="01" transform="translate(166 152)">
    <rect class="node" width="308" height="104" rx="8"/>
    <text class="number" x="20" y="29">01</text>
    <text class="heading" x="58" y="29">增加审批提醒接口和后台任务</text>
    <path class="divider" d="M20 43 H288"/>
    <text class="file" x="20" y="65">reminders/api.py</text>
    <text class="function" x="186.95" y="65">save_policy()</text>
    <text class="file" x="20" y="88">reminders/service.py</text>
    <text class="function" x="186.95" y="88">scan_due()</text>
  </g>
  <g data-stage="02" transform="translate(164 288)">
    <rect class="node" width="312" height="104" rx="8"/>
    <text class="number" x="20" y="29">02</text>
    <text class="heading" x="58" y="29">并行查询订单和商品资料</text>
    <path class="divider" d="M20 43 H292"/>
    <text class="file" x="20" y="76">collaboration.py</text>
    <text class="function" x="158.36" y="76">run_specialists()</text>
  </g>
  <g data-stage="03" transform="translate(180 424)">
    <rect class="node" width="280" height="104" rx="8"/>
    <text class="number" x="20" y="29">03</text>
    <text class="heading" x="58" y="29">合并结果并拒绝重复冲突</text>
    <path class="divider" d="M20 43 H260"/>
    <text class="file" x="20" y="76">state_merge.py</text>
    <text class="function" x="144.08" y="76">merge_results()</text>
  </g>
  <g data-stage="04" transform="translate(150 560)">
    <rect class="node" width="340" height="104" rx="8"/>
    <text class="number" x="20" y="29">04</text>
    <text class="heading" x="58" y="29">进程退出后继续未完成任务</text>
    <path class="divider" d="M20 43 H320"/>
    <text class="file" x="20" y="65">agent_runtime/worker.py</text>
    <text class="function" x="208.41" y="65">claim()</text>
    <text class="file" x="20" y="88">branch_store.py</text>
    <text class="function" x="208.41" y="88">start_branch()</text>
  </g>
  <g data-stage="05" transform="translate(156 696)">
    <rect class="node" width="328" height="104" rx="8"/>
    <text class="number" x="20" y="29">05</text>
    <text class="heading" x="58" y="29">测量数据库查询并增加索引</text>
    <path class="divider" d="M20 43 H308"/>
    <text class="file" x="20" y="65">order_query_benchmark.py</text>
    <text class="function" x="236.98" y="65">measure()</text>
    <text class="file" x="20" y="88">0030_order_query_indexes.py</text>
    <text class="function" x="236.98" y="88">upgrade()</text>
  </g>
  <g data-stage="06" transform="translate(130 832)">
    <rect class="node" width="380" height="104" rx="8"/>
    <text class="number" x="20" y="29">06</text>
    <text class="heading" x="58" y="29">限制模型输入并复用HTTP连接</text>
    <path class="divider" d="M20 43 H360"/>
    <text class="file" x="20" y="65">context.py</text>
    <text class="function" x="158.36" y="65">select_context()</text>
    <text class="file" x="20" y="88">model_clients.py</text>
    <text class="function" x="158.36" y="88">ModelClients.for_request()</text>
  </g>
  <g data-stage="07" transform="translate(140 968)">
    <rect class="node" width="360" height="104" rx="8"/>
    <text class="number" x="20" y="29">07</text>
    <text class="heading" x="58" y="29">前端逐步显示正文并支持重连</text>
    <path class="divider" d="M20 43 H340"/>
    <text class="file" x="20" y="65">streaming.py</text>
    <text class="function" x="208.41" y="65">DraftStream.add()</text>
    <text class="file" x="20" y="88">conversations/stream.py</text>
    <text class="function" x="208.41" y="88">events()</text>
  </g>
  <g data-stage="08" transform="translate(192 1104)">
    <rect class="node" width="256" height="104" rx="8"/>
    <text class="number" x="20" y="29">08</text>
    <text class="heading" x="58" y="29">部署服务与检查运行状态</text>
    <path class="divider" d="M20 43 H236"/>
    <text class="file" x="20" y="65">release_exercise.py</text>
    <text class="function" x="179.81" y="65">main()</text>
    <text class="file" x="20" y="88">release_check.py</text>
    <text class="function" x="179.81" y="88">check()</text>
  </g>
  <g data-stage="09" transform="translate(134 1240)">
    <rect class="node" width="372" height="104" rx="8"/>
    <text class="number" x="20" y="29">09</text>
    <text class="heading" x="58" y="29">核对模型用量并交付完整项目</text>
    <path class="divider" d="M20 43 H352"/>
    <text class="file" x="20" y="65">model_usage.py</text>
    <text class="function" x="172.66" y="65">reconcile_model_usage()</text>
    <text class="file" x="20" y="88">verify_delivery.py</text>
    <text class="function" x="172.66" y="88">verify()</text>
  </g>
</svg>
