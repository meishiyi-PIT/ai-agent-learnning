# HAProxy 3.2。两台独立网关位于已有内网 L4 LB 后方。
global
    log stdout format raw local0
    maxconn 256
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    # 仅记录连接、状态、字节量和耗时；省略请求地址、请求头及正文。
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq"
    retries 0
    timeout queue 2s
    timeout connect 3s
    timeout client 35s
    timeout server 35s

frontend model_gateway
    bind :443 ssl crt /run/secrets/model_gateway.pem
    acl gateway_health path -m str /healthz
    http-request return status 200 content-type application/json string '{"status":"ok"}' if gateway_health
    acl model_api path_beg /v1/
    http-request deny deny_status 403 unless model_api
    default_backend vllm_nodes

backend vllm_nodes
    balance leastconn
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # 后端 HTTP 仅使用 VPC 私网；安全组只接收两台网关的连接。
    default-server inter 3s fall 3 rise 2 maxconn 8 maxqueue 8
    server gpu_node_01 10.20.10.11:8000 check
    server gpu_node_02 10.20.10.12:8000 check
